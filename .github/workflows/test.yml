name: test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lein-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@12.5
        with:
          lein: latest
          bb: latest
      - name: Run tests
        run: lein test

  clj-kondo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@12.5
        with:
          clj-kondo: latest
      - name: Lint
        # TODO: drop continue-on-error once the existing lint backlog is cleared
        continue-on-error: true
        run: clj-kondo --lint src test
